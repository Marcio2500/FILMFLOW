<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filmflow - Login</title>
</head>
<body>
    
    <h1>Filmflow - Login/h1>
    <a href="index.html">Voltar ao inicio</a>

    <hr>

    <h2>Criar conta</h2>
    <form id="form-registo">
        <label>Nome:</label><br>
        <input type="text" id="reg-nome" required><br><br>

        <label>Email:</label><br
        <input type="email" id="reg-email" required><br><br>

        <label>Password:</label><br>
        <input type="password" id="reg-password" required><br><br>

        <label>Preferências (opcional):</label><br>
        <input type="checbox" name="preferencias" value="Alegre"> Alegre<br>
        <input type="checbox" name="preferencias" value="Tenso"> 
        <input type="checbox" name="preferencias" value="Triste"> Triste<br>
        <input type="checbox" name="preferencias" value="Relaxado"> Relaxado<br><br>

        <button type="submit">Criar conta</button>
    </form>
    <p id="msg-registo"></p>

    <hr>

    <h2>Já tensconta? Entra aqui</h2>
    <form id="form-login">
        <label>Email:</label><br>
        <input type="email" id="login-email" required><br><br>

        <label>Password:</label><br>
        <input type="password" id="login-password" required><br><br>

        <button type="submit">Entrar</button>
        

</body>
</html>
