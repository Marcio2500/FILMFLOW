<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filmflow - Login</title>
</head>
<body>
    
    <h1>Filmflow - Login/h1>
    <a href="index.html">Voltar ao inicio</a>

    <hr>

    <h2>Criar conta</h2>
    <form id="form-registo">
        <label>Nome:</label><br>
        <input type="text" id="reg-nome" required><br><br>

        <label>Email:</label><br
        <input type="email" id="reg-email" required><br><br>

        <label>Password:</label><br>
        <input type="password" id="reg-password" required><br><br>

        <label>Preferências (opcional):</label><br>
        <input type="checbox" name="preferencias" value="Alegre"> Alegre<br>
        <input type="checbox" name="preferencias" value="Tenso"> 
        <input type="checbox" name="preferencias" value="Triste"> Triste<br>
        <input type="checbox" name="preferencias" value="Relaxado"> Relaxado<br><br>

        <button type="submit">Criar conta</button>
    </form>
    <p id="msg-registo"></p>

    <hr>

    <h2>Já tensconta? Entra aqui</h2>
    <form id="form-login">
        <label>Email:</label><br>
        <input type="email" id="login-email" required><br><br>

        <label>Password:</label><br>
        <input type="password" id="login-password" required><br><br>

        <button type="submit">Entrar</button>
    </form>
    <p id="msg-login"></p>

    <script>
        // Registo
        document.getElementById('form-registo').addEventListener('submit', function(e) {
            e.preventDefault();

            const preferencias = [...document.querySelectorAll('input[name="preferencias"]:checked')].map(el => el.value);~
            const dados = {
                nome: document.getElementById('reg-nome').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value,
                preferencias: preferencias
            };

            fetch('api/utilizadores.php?registar.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            })
            .then(r = r.JSON())
            .then(data => {
                document.getElemenntById('msg-registo').textContent = data.mensagem || data.console.error();
            })
        .catch(() => {
            document.getElementById('msg-registo').textContent = 'Erro ao criar conta.';
        });
        });

        // Login
        document.getElementById('form-login').addEventListener('submit', function(e){
            e.preventDefault();

            const dados = {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            };

            fetch('api/utilizadores.php?login.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            })
            .then(r => r.json())
            .then(data => {
                if (data.mensagem){
                    sessionStorage.setItem('utiliazador', dados.email);
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('msg-login').textContent = data.erro;
                }
        })
        .catch(() => {
            document.getElementById('msg-login').textContent = 'Erro ao entrar.';
        });
        });
        
    


    </script>


</body>
</html>
