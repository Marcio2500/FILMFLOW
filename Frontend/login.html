<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filmflow - Login</title>
</head>
<body>
    
    <h1>Filmflow- login</h1>
    
        <a href="index.html">Voltar ao inicio</a>

    <hr>

    <h2>Criar conta</h2>
    <form id="form-registo">
        <label>Nome:</label><br>
        <input type="text" id="reg-nome" required><br><br>

        <label>Email:</label><br>
        <input type="email" id="reg-email" required><br><br>

        <label>Password:</label><br>
        <input type="password" id="reg-password" required><br><br>

        <label>Preferências (opcional):</label><br>
        <input type="checkbox" name="preferencias" value="Alegre"> Alegre<br>
        <input type="checkbox" name="preferencias" value="Tenso"> Tenso<br>
        <input type="checkbox" name="preferencias" value="Triste"> Triste<br>
        <input type="checkbox" name="preferencias" value="Relaxado"> Relaxado<br><br>

        <button type="submit">Criar conta</button>
    </form>
    <p id="msg-registo"></p>

    <hr>

    <h2>Já tensconta? Entra aqui</h2>
    <form id="form-login">
        <label>Email:</label><br>
        <input type="email" id="login-email" required><br><br>

        <label>Password:</label><br>
        <input type="password" id="login-password" required><br><br>

        <button type="submit">Entrar</button>
    </form>
    <p id="msg-login"></p>

    <script>
        const API_BASE_URL = 'http://127.0.0.1/backend/api';
        // This frontend must be served from the same Apache/MAMP root at http://127.0.0.1/

        // Registo
        document.getElementById('form-registo').addEventListener('submit', function(e) {
            e.preventDefault();

            const dados = {
                nome: document.getElementById('reg-nome').value,
                email: document.getElementById('reg-email').value,
                senha: document.getElementById('reg-password').value
            };

            fetch(`${API_BASE_URL}/registar.php`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            })
            .then(response => response.text().then(text => {
                const data = text ? JSON.parse(text) : {};
                if (!response.ok) {
                    throw new Error(data.erro || 'Resposta inválida');
                }
                return data;
            }))
            .then(data => {
                document.getElementById('msg-registo').textContent = data.mensagem || data.erro;
            })
            .catch((err) => {
                document.getElementById('msg-registo').textContent = 'Erro ao criar conta: ' + err.message;
            });
        });

        // Login
        document.getElementById('form-login').addEventListener('submit', function(e){
            e.preventDefault();

            const dados = {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            };

            fetch(`${API_BASE_URL}/login.php`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            })
            .then(response => response.text().then(text => {
                const data = text ? JSON.parse(text) : {};
                if (!response.ok) {
                    throw new Error(data.erro || 'Resposta inválida');
                }
                return data;
            }))
            .then(data => {
                if (data.mensagem){
                    sessionStorage.setItem('utilizador', dados.email);
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('msg-login').textContent = data.erro;
                }
            })
            .catch((err) => {
                document.getElementById('msg-login').textContent = 'Erro ao fazer login: ' + err.message;
            });
        });
    </script>


</body>
</html>
