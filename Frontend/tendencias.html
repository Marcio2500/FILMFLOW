<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmflow — Tendências</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <span class="film">FILM</span><span class="flow">FLOW</span>
    </a>
    <ul class="navbar-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="mapa.html">Mapa</a></li>
      <li><a href="tendencias.html" class="active">Tendências</a></li>
      <li><a href="recomendacoes.html">Para Ti</a></li>
    </ul>
    <a href="login.html" class="btn-entrar">Entrar</a>
  </nav>

  <!-- TENDÊNCIAS -->
  <div class="section">
    <h2 class="section-title">TENDÊNCIAS NACIONAIS</h2>
    <p class="section-desc">Os conteúdos em maior crescimento em Portugal</p>

    <div class="tend-top-row">
      <div class="tend-filters">
        <button class="filter-btn active" onclick="filtrar(this,'todos')">Todos</button>
        <button class="filter-btn" onclick="filtrar(this,'hot')">🔥 Hot</button>
        <button class="filter-btn" onclick="filtrar(this,'trending')">📈 Trending</button>
        <button class="filter-btn" onclick="filtrar(this,'descida')">📉 A descer</button>
      </div>
      <span style="font-size:0.75rem;color:rgba(255,255,255,0.3);letter-spacing:1px">ESTA SEMANA</span>
    </div>

    <div class="tend-grid" id="tend-grid"></div>
  </div>

  <!-- COMPARAR -->
  <div class="section" style="background:#0a0a0a" id="comparar">
    <h2 class="section-title">COMPARAR CIDADES</h2>
    <p class="section-desc" style="margin-bottom:1.5rem">Escolhe duas cidades e compara o que estão a ver</p>

    <div class="comparar-wrap">
      <div class="comparar-selectors">
        <div class="comparar-select-wrap">
          <label class="field-label">Cidade A</label>
          <select class="select" id="sel-a">
            <option value="lisboa">Lisboa</option>
            <option value="porto">Porto</option>
            <option value="coimbra">Coimbra</option>
            <option value="braga">Braga</option>
            <option value="faro">Faro</option>
            <option value="aveiro">Aveiro</option>
            <option value="setubal">Setúbal</option>
            <option value="evora">Évora</option>
          </select>
        </div>
        <div class="vs-badge">VS</div>
        <div class="comparar-select-wrap">
          <label class="field-label">Cidade B</label>
          <select class="select" id="sel-b">
            <option value="porto">Porto</option>
            <option value="lisboa">Lisboa</option>
            <option value="coimbra">Coimbra</option>
            <option value="braga">Braga</option>
            <option value="faro">Faro</option>
            <option value="aveiro">Aveiro</option>
            <option value="setubal">Setúbal</option>
            <option value="evora">Évora</option>
          </select>
        </div>
        <button class="btn-primary" onclick="comparar()">Comparar</button>
      </div>

      <div id="comparar-result" style="display:none">
        <table class="comparar-table">
          <thead>
            <tr>
              <th class="col-a" id="th-a">Lisboa</th>
              <th class="col-mid">Filme</th>
              <th class="col-b" id="th-b">Porto</th>
            </tr>
          </thead>
          <tbody id="comparar-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <style>
    .tend-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.5rem 0;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .tend-filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .filter-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 1rem;
      border-radius: 20px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .filter-btn.active { background: #e5181b; color: #fff; border-color: #e5181b; }

    .tend-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .tend-card {
      background: #1a1a1f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 1.4rem 1.6rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }

    .tend-card:hover {
      border-color: rgba(255,255,255,0.18);
      transform: translateY(-2px);
    }

    .tend-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.3rem;
    }

    .tend-card-name { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .tend-card-genre { font-size: 0.82rem; color: rgba(255,255,255,0.4); margin-bottom: 1rem; }

    .tend-card-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-hot      { background: #e5181b; color: #fff; }
    .badge-trending { background: #2563eb; color: #fff; }
    .badge-descida  { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }

    .tend-growth-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .tend-growth-label { font-size: 0.82rem; color: rgba(255,255,255,0.4); }
    .tend-growth-pct { font-size: 0.9rem; font-weight: 700; }
    .pct-up   { color: #4ade80; }
    .pct-down { color: rgba(255,255,255,0.3); }

    .tend-bar-bg {
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .tend-bar-fill { height: 5px; border-radius: 3px; }
    .bar-red  { background: #e5181b; }
    .bar-blue { background: #2563eb; }
    .bar-gray { background: rgba(255,255,255,0.2); }

    .tend-cities { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .city-tag {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      padding: 0.15rem 0.6rem;
    }

    /* COMPARAR */
    .comparar-wrap {
      background: #1a1a1f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 1.5rem;
    }

    .comparar-selectors {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .comparar-select-wrap { flex: 1; min-width: 140px; }

    .field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.35rem;
    }

    .select {
      width: 100%;
      background: #111116;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      padding: 0.6rem 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .vs-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      color: rgba(255,255,255,0.25);
      padding-bottom: 0.4rem;
      flex-shrink: 0;
    }

    .comparar-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }

    .comparar-table th {
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .col-a   { color: #e5181b; text-align: left; }
    .col-b   { color: #2563eb; text-align: right; }
    .col-mid { color: rgba(255,255,255,0.3); text-align: center; font-size: 0.75rem; }

    .comparar-table td { padding: 0.7rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .comparar-table tr:hover td { background: rgba(255,255,255,0.02); }
    .comparar-table tr:last-child td { border-bottom: none; }

    .val-a { font-weight: 600; text-align: left; }
    .val-b { font-weight: 600; text-align: right; }
    .val-mid { color: rgba(255,255,255,0.3); text-align: center; font-size: 0.82rem; }
    .win-a { color: #e5181b !important; }
    .win-b { color: #2563eb !important; }
  </style>

  <script>
    const TENDENCIAS = [
      { t:'Alien: Romulus',      g:'Terror · Sci-Fi · 2024',   p:92, c:32, tipo:'hot',      cidades:['Lisboa','Porto','Braga']   },
      { t:'Oppenheimer',         g:'Drama · História · 2023',  p:88, c:28, tipo:'hot',      cidades:['Lisboa','Porto']           },
      { t:'Dune: Part Two',      g:'Ficção Científica · 2024', p:78, c:21, tipo:'trending', cidades:['Faro','Coimbra','Évora']   },
      { t:'Gladiador II',        g:'Ação · Drama · 2024',      p:75, c:18, tipo:'trending', cidades:['Braga','Setúbal']          },
      { t:'Deadpool & Wolverine',g:'Ação · Comédia · 2024',    p:60, c:14, tipo:'trending', cidades:['Lisboa','Faro']            },
      { t:'Poor Things',         g:'Drama · Fantasia · 2023',  p:40, c:-5, tipo:'descida',  cidades:['Coimbra','Aveiro']         },
    ];

    const FILMES_CMP = {
      lisboa:  [{t:'Oppenheimer',p:98},{t:'Dune: Part Two',p:94},{t:'Alien: Romulus',p:89},{t:'Gladiador II',p:85},{t:'Poor Things',p:78}],
      porto:   [{t:'Oppenheimer',p:85},{t:'Alien: Romulus',p:95},{t:'Dune: Part Two',p:80},{t:'Gladiador II',p:90},{t:'Poor Things',p:65}],
      coimbra: [{t:'Oppenheimer',p:78},{t:'Alien: Romulus',p:65},{t:'Dune: Part Two',p:70},{t:'Gladiador II',p:60},{t:'Poor Things',p:85}],
      braga:   [{t:'Oppenheimer',p:72},{t:'Alien: Romulus',p:80},{t:'Dune: Part Two',p:68},{t:'Gladiador II',p:90},{t:'Poor Things',p:75}],
      faro:    [{t:'Oppenheimer',p:82},{t:'Alien: Romulus',p:75},{t:'Dune: Part Two',p:88},{t:'Gladiador II',p:70},{t:'Poor Things',p:55}],
      aveiro:  [{t:'Oppenheimer',p:68},{t:'Alien: Romulus',p:60},{t:'Dune: Part Two',p:70},{t:'Gladiador II',p:58},{t:'Poor Things',p:78}],
      setubal: [{t:'Oppenheimer',p:75},{t:'Alien: Romulus',p:65},{t:'Dune: Part Two',p:72},{t:'Gladiador II',p:80},{t:'Poor Things',p:60}],
      evora:   [{t:'Oppenheimer',p:58},{t:'Alien: Romulus',p:74},{t:'Dune: Part Two',p:62},{t:'Gladiador II',p:65},{t:'Poor Things',p:66}],
    };

    let filtroAtivo = 'todos';

    function renderTendencias() {
      const lista = filtroAtivo === 'todos' ? TENDENCIAS : TENDENCIAS.filter(f => f.tipo === filtroAtivo);
      document.getElementById('tend-grid').innerHTML = lista.map(f => {
        const badgeClass = f.tipo==='hot' ? 'badge-hot' : f.tipo==='trending' ? 'badge-trending' : 'badge-descida';
        const badgeText  = f.tipo==='hot' ? '🔥 Hot' : f.tipo==='trending' ? '📈 Trending' : '📉 A descer';
        const barClass   = f.tipo==='hot' ? 'bar-red' : f.tipo==='trending' ? 'bar-blue' : 'bar-gray';
        return `
          <div class="tend-card">
            <div class="tend-card-header">
              <div>
                <div class="tend-card-name">${f.t}</div>
                <div class="tend-card-genre">${f.g}</div>
              </div>
              <span class="tend-card-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="tend-growth-row">
              <span class="tend-growth-label">Crescimento</span>
              <span class="tend-growth-pct ${f.c>0?'pct-up':'pct-down'}">${f.c>0?'+':''}${f.c}%</span>
            </div>
            <div class="tend-bar-bg">
              <div class="tend-bar-fill ${barClass}" style="width:${f.p}%"></div>
            </div>
            <div class="tend-cities">
              ${f.cidades.map(c=>`<span class="city-tag">${c}</span>`).join('')}
            </div>
          </div>`;
      }).join('');
    }

    function filtrar(btn, tipo) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtroAtivo = tipo;
      renderTendencias();
    }

    function comparar() {
      const idA = document.getElementById('sel-a').value;
      const idB = document.getElementById('sel-b').value;
      if (idA === idB) { alert('Escolhe duas cidades diferentes!'); return; }

      document.getElementById('th-a').textContent = document.getElementById('sel-a').selectedOptions[0].text;
      document.getElementById('th-b').textContent = document.getElementById('sel-b').selectedOptions[0].text;

      const fA = FILMES_CMP[idA] || [];
      const fB = FILMES_CMP[idB] || [];

      document.getElementById('comparar-body').innerHTML = fA.map((fa, i) => {
        const fb = fB[i] || {p:0};
        return `<tr>
          <td class="val-a ${fa.p>fb.p?'win-a':''}">${fa.p}</td>
          <td class="val-mid">${fa.t}</td>
          <td class="val-b ${fb.p>fa.p?'win-b':''}">${fb.p}</td>
        </tr>`;
      }).join('');

      document.getElementById('comparar-result').style.display = 'block';
    }

    renderTendencias();
  </script>

</body>
</html>
