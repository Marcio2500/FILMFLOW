<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FIlmflow - Tendências</title>
</head>
<body>
     <h1>Tendências</h1>
     <a href="index.html">Voltar ao inicio</a>

     <hr>

     <h2>Tendências Nacionais</h2>
     <p>Os conteúdos em maior crescimento em Portugal.</p>

     <button onclick="carregarTendencias()">Atualizar</button>

     <hr>                  

     <div id="resultado-tendencias"><p>Clica em "Atualizar" para ver as tendências.</p></div>

     <script>
        function carregarTendencias() {
            document.getElementById('resultado-tendencias').innerHTML = 'A carregar...';

            // Carrega tendências de todas as regiões
            const regioes = [
                {id: 1, nome: 'Lisboa'},
                {id: 2, nome: 'Porto'},
                {id: 3, nome: 'Coimbra'},
                {id: 4, nome: 'Faro'},
            ];

            const pedidos = regioes.map(r => 
                fetch(`../backend/api/get_trends.php?loc=${r.id}`)
                    .then(res => res.json())
                    .then(data => ({regiao: r.nome, tendencias: data.tendencias || []}))
            );

            Promise.all(pedidos)
                .then(resultados => {
                    let html = '';
                    resultados.forEach(r => {
                        html += `<h3>Em ascensão - ${r.regiao}</h3>`;
                        if (!r.tendencias.length) {
                            html += '<p>Sem dados.</p>';
                            return;
                        }
                        html += '<ul>';
                        r.tendencias.forEach(f => {
                            const sinal = f.crescimento_pct > 0 ? '📈' : '📉';
                            html += `<li><strong>${f.titulo}</strong> - ${f.total_views} views - ${sinal}${f.crescimento_pct}%</li>`;
                        });
                        html += '</ul>';
                    });
                    document.getElementById('resultado-tendencias').innerHTML = html;
                })
                .catch(() => {
                    document.getElementById('resultado-tendencias').innerHTML = 'Erro ao carregar tendências.';
                });
        }
     </script>
                                                                
</body>
</html>
