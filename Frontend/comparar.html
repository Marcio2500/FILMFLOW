<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filmflow - Comparar Ciadades</title>
</head>
<body>
    
    <h1>Filmflow</h1>
    <a href="index.html">Voltar ao inicio</a>

    <hr>

    <h2>Comparar cidades</h2>

    <label>Cidade A:</label>
    <select id="select-cidade-a">
        <option value="1">Lisboa</option>
        <option value="2">Porto</option>
        <option value="3">Coimbra</option>
        <option value="4">Faro</option>
    </select>
    <br><br>

    <label>Cidade B:</label>
    <select id="select-cidade-b">
        <option value="1">Lisboa</option>
        <option value="2">Porto</option>
        <option value="3">Coimbra</option>
        <option value="4">Faro</option>
    </select>
    <br><br>

    <button onclick="compararCidades()">Comparar</button>


    <hr>

    <div id="resultado-comparar"><p>Seleciona duas cidades e clica em "Comparar".</p></div>

    <script>
        function comparar() {
            const idA = document.getElementById('select-cidade-a').value;
            const idB = document.getElementById('select-cidade-b').value;
            const nomeA = document.getElementById('select-cidade-a').selectedOptions[0].text;
            const nomeB = document.getElementById('select-cidade-b').selectedOptions[0].text;

            if(idA === idB) {
                document.getElementById('resultado-comparar').innerHTML = '<p>Escolhe duas cidadesdiferentes.</p>';
                return;
            }

            document.getElementById('resultado-comparar').innerHTML = 'A carregar...';

            Promise.all([
                fetch(`http://localhost:8001/get_cidade.php?loc=${idA}`).then(res => res.json()),
                fetch(`http://localhost:8001/get_cidade.php?loc=${idB}`).then(res => res.json())
            ])
            .then(([dadoA, dadoB]) => {
                // Process data
                document.getElementById('resultado-comparar').innerHTML = 'Dados carregados.';
            })
            .catch(() => {
                document.getElementById('resultado-comparar').innerHTML = 'Erro ao carregar dados.';
            });
    </script>
</body>
</html>
