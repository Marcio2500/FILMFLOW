<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filmflow - Mood</title>
</head>
<body>
    <h1>Filmflow</h1>
    <a href="index.html">Voltar ao inicio</a>

    <hr>

    <h2>o que precisas agora?</h2>
    <p>Escolhe o teu mood e descobre o que portugal está a ver.</p>

    <form id="mood-form">
        <label><input type="checkbox" name="mood" value="Alegre"> rir um pouco</label><br>
        <label><input type="checkbox" name="mood" value="Tenso"> Adrenalina pura</label><br>
        <label><input type="checkbox" name="mood" value="Triste"> Chorar as escondidads</label><br>
        <label><input type="checkbox" name="mood" value="Relaxado"> Relaxar sem pensar</label><br>
        <button type="submit">Ver sugestões</button>
        <button type="reset">Saltar por agora</button>
    </form>

    <hr>

    <h2 id="titulo-resultado"></h2>
    <div id="resultado-mood"></div>


    <script>
        document.getElementById('mood-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const checked = document.querySelectorAll('input[name="mood"]:checked').value;
            const mood = Array.from(checked).map(el => el.value).join(', ');
            sessionStorage.setItem('mood', mood);

            fetch(`http://localhost:8001/get_mood.php?moods=${encodeURIComponent(mood)}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.sugestoes || data.sugestoes.length === 0) {
                        document.getElementById('titulo-resultado').innerHTML = '<p>Sem sugestões para este mood.</p>';
                        return;
                    }
                    let html = '<ul>';
                    data.sugestoes.forEach(f => {
                        html += `<li><strong>${f.titulo}</strong> (${f.ano}) - popularidade: ${f.popularidade} - ${f.cidade || 'Nacional'}</li>`;
                    });
                    html += '</ul>';
                    document.getElementById('resultado-mood').innerHTML = html;
                })
                .catch(() => {
                    document.getElementById('resultado-mood').innerHTML = 'Erro ao carregar sugestões.';
                });
        });

        function saltar() {
            sessionStorage.setItem('mood', 'Nenhum');
            window.location.href = 'index.html';
        }   
    </script>
</body>
</html>
