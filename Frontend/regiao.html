<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filmflow - top por regiãot</title>
</head>
<body>
     <h1>Filmflow</h1>
        <a href="index.html">Voltar ao inicio</a>

        <hr>

        <h2>Top por região</h2>

        <label>Escolhe a região:</label><br>
        <select id="select-regiao">
            <option value="1">Lisboa</option>
            <option value="2">Porto</option>
            <option value="3">Coimbra</option>
            <option value="4">Faro</option>
        </select>

        <label>Período:</label>
        <select id="select-periodo">
            <option value="hoje">Hoje</option>
            <option value="semana">Esta semana</option>
            <option value="mes">Este mês</option>
            </select>

            <button onclick="carregarTop()">Ver top</button>

            <hr>

            <h3 id="titulo-top"></h3>
            <div id="resultado-top"><p>Seleciona uma região e clica em "ver top".</p></div>

            <script>
                function carregarTop() {
        const regiao = document.getElementById("select-regiao").value;
        const nomeRegiao = document.getElementById("select-regiao").selectedOptions[0].text;
        const periodo = document.getElementById("select-periodo").value;

        document.getElementById("titulo-top").innerText = 'A carregar...';
        document.getElementById("resultado-top").innerHTML = '';

        fetch(`http://localhost:8001/get_trends.php?loc=${regiao}`)
            .then(res => res.json())
            .then(data => {
                const lista = data.tendencias || [];

                document.getElementById("titulo-top").innerText = `Top em ${nomeRegiao}`;

                if (!lista.length) {
                    document.getElementById("resultado-top").innerHTML = '<p>Sem dados para esta região.</p>';
                    return;
                }

                let html = '<table border="1" cellpadding="8"><thead><tr><th>#</th><th>Filme</th><th>Views</th><th>Tendência</th></tr></thead><tbody>';
                lista.forEach((f, i) => {
                    const sinal = f.crescimento_pct > 0 ? '📈' : '📉';
                    html += `<tr>
                        <td>${i + 1}</td>
                        <td>${f.titulo}</td>
                        <td>${f.total_views} views</td>
                        <td>${sinal} ${f.crescimento_pct}%</td>
                    </tr>`;
                });
                html += '</tbody></table>';

                document.getElementById("resultado-top").innerHTML = html;
            })
            .catch(() => {
                document.getElementById("resultado-top").innerHTML = '<p>Erro ao carregar dados.</p>';
            });
    }
               
            </script>

</body>
</html>
