<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filmflow - top por regiãot</title>
</head>
<body>
     <h1>Filmflow</h1>
        <a href="index.html">Voltar ao inicio</a>

        <hr>

        <h2>Top por região</h2>

        <label>Escolhe a região:</label><br>
        <select id="select-regiao">
            <option value="1">Lisboa</option>
            <option value="2">Porto</option>
            <option value="3">Coimbra</option>
            <option value="4">Faro</option>
        </select>

        <label>Período:</label>
        <select id="select-periodo">
            <option value="hoje">Hoje</option>
            <option value="semana">Esta semana</option>
            <option value="mes">Este mês</option>
            </select>

            <button onclick="carregarTop()">Ver top</button>

            <hr>

            <h3 id="titulo-top"></h3>
            <div id="resultado-top"><p>Seleciona uma região e clica em "ver top".</p></div>

            <script>
                function carregarTop() {
                    const regiao = document.getElementById("select-regiao").value;
                    const periodo = document.getElementById("select-periodo").selectdoptions[0].text;
                    const periodo_val = document.getElementById("select-periodo").value;

                    document.getElementById("titulo-top").innerText = 'A carregar...';

                    fetch(`api/get_top.php?loc=${regiao}&periodo=${periodo_val}`)
                        .then(res => res.json())
                        .then(data => {
                            const lista = data.tendencias || [];

                            if (!lista.length) {
                                document.getElementById('resultado-top').innerHTML = '<p>Sem dados para esta região e período.</p>';
                                return;
                            }
                            let html = `<h3>Top em ${periodo} - ${data.regiao}</h3><ul>`;
                            data.top.forEach(f => {
                                html += `<li><strong>${f.titulo}</strong> (${f.ano}) - popularidade: ${f.popularidade}</li>`;
                            });
                            html += '</ul>';
                            document.getElementById('resultado-top').innerHTML = html;
                        })
                        .catch(() => {
                            document.getElementById('resultado-top').innerHTML = 'Erro ao carregar top.';
                        });
                }
            </script>

</body>
</html>
