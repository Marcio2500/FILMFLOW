<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmflow — Recomendações</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="mapa.html" class="navbar-logo">Filmflow</a>
    <ul class="navbar-links">
      <li><a href="mapa.html">Mapa</a></li>
      <li><a href="tendencias.html">Tendências</a></li>
      <li><a href="recomendacoes.html" class="active">Recomendações</a></li>
    </ul>
    <div class="navbar-spacer"></div>
    <a href="login.html" class="btn btn-ghost" style="font-size:0.8rem; padding:0.35rem 0.9rem;">Entrar</a>
  </nav>

  <main class="page">

    <!-- MOOD BANNER -->
    <div class="mood-banner" id="mood-banner">
      <span class="mood-banner-icon" id="mood-icon">⚡</span>
      <div class="mood-banner-text">
        <p>Recomendações baseadas no teu mood</p>
        <strong id="mood-label">Tenso — Adrenalina pura</strong>
      </div>
      <a href="chatbot.html" class="mood-change">Mudar mood</a>
    </div>

    <!-- PARA TI -->
    <div class="section-header">
      <h2 class="section-title" style="font-size:1.4rem;">Para Ti</h2>
      <span class="section-sub" id="rec-sub">Baseado no teu mood · Portugal</span>
    </div>

    <div class="rec-scroll-wrap">
      <div class="rec-scroll" id="rec-scroll"></div>
    </div>

    <div class="divider"></div>

    <!-- MAIS POPULARES -->
    <div class="section-header" style="margin-bottom:1rem">
      <h2 class="section-title" style="font-size:1.4rem;">Mais Populares</h2>
      <span class="section-sub">Esta semana em Portugal</span>
    </div>

    <div class="pop-list" id="pop-list"></div>

  </main>

  <style>
    /* MOOD BANNER */
    .mood-banner {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(229,24,27,0.06);
      border: 1px solid rgba(229,24,27,0.15);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      margin-bottom: 2rem;
    }

    .mood-banner-icon { font-size: 1.6rem; }

    .mood-banner-text { flex: 1; }
    .mood-banner-text p { font-size: 0.78rem; color: var(--text-muted); }
    .mood-banner-text strong { font-size: 1rem; color: var(--text); font-weight: 600; }

    .mood-change {
      font-size: 0.8rem;
      color: rgba(229,24,27,0.7);
      text-decoration: underline;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .mood-change:hover { color: var(--red); }

    /* SECTION HEADER */
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .section-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* REC SCROLL */
    .rec-scroll-wrap { overflow-x: auto; padding-bottom: 0.75rem; margin-bottom: 2rem; }
    .rec-scroll-wrap::-webkit-scrollbar { height: 4px; }
    .rec-scroll-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .rec-scroll { display: flex; gap: 0.75rem; width: max-content; }

    .rec-card {
      width: 150px;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--ease);
    }

    .rec-card:hover {
      border-color: rgba(229,24,27,0.3);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .rec-poster {
      height: 100px;
      background: linear-gradient(135deg, #1a1a24, #24181e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      position: relative;
    }

    .rec-poster-badge {
      position: absolute;
      top: 6px;
      right: 6px;
    }

    .rec-body { padding: 0.75rem; }
    .rec-name { font-size: 0.88rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .rec-genre { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 6px; }
    .rec-bar-bg { height: 2px; background: rgba(255,255,255,0.07); border-radius: 1px; overflow: hidden; }
    .rec-bar-fill { height: 2px; background: var(--red); border-radius: 1px; }

    /* POP LIST */
    .pop-list { display: flex; flex-direction: column; }

    .pop-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      transition: padding-left var(--ease);
    }

    .pop-item:hover { padding-left: 0.5rem; }
    .pop-item:last-child { border-bottom: none; }

    .pop-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: var(--text-muted);
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .pop-info { flex: 1; min-width: 0; }
    .pop-name { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .pop-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 1px; }

    .pop-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .pop-growth { font-size: 0.82rem; font-weight: 600; }
  </style>

  <script>
    const MOODS = {
      tenso:    { icon:'⚡', label:'Tenso — Adrenalina pura' },
      alegre:   { icon:'😄', label:'Alegre — Rir um pouco' },
      triste:   { icon:'🌧️', label:'Triste — Chorar às escondidas' },
      relaxado: { icon:'🌿', label:'Relaxado — Desligar e não pensar' },
    };

    const RECS = {
      tenso:    [
        { t:'Alien: Romulus',      g:'Terror · Sci-Fi',      p:92, icon:'🛸', hot:true  },
        { t:'Gladiador II',        g:'Ação · Drama',         p:85, icon:'⚔️', hot:false },
        { t:'Dune: Part Two',      g:'Ficção Científica',    p:78, icon:'🌌', hot:false },
        { t:'Deadpool & Wolverine',g:'Ação · Comédia',       p:70, icon:'💥', hot:false },
        { t:'Furiosa',             g:'Ação · Aventura',      p:62, icon:'🔫', hot:false },
      ],
      alegre:   [
        { t:'Barbie',              g:'Comédia · Fantasia',   p:90, icon:'💅', hot:true  },
        { t:'Poor Things',         g:'Drama · Fantasia',     p:78, icon:'🌸', hot:false },
        { t:'Deadpool & Wolverine',g:'Ação · Comédia',       p:72, icon:'💥', hot:false },
      ],
      triste:   [
        { t:'Oppenheimer',         g:'Drama · História',     p:88, icon:'💣', hot:true  },
        { t:'Poor Things',         g:'Drama · Fantasia',     p:80, icon:'🌸', hot:false },
        { t:'Past Lives',          g:'Drama · Romance',      p:74, icon:'🌙', hot:false },
      ],
      relaxado: [
        { t:'Poor Things',         g:'Drama · Fantasia',     p:85, icon:'🌸', hot:false },
        { t:'Dune: Part Two',      g:'Ficção Científica',    p:76, icon:'🌌', hot:false },
        { t:'Past Lives',          g:'Drama · Romance',      p:68, icon:'🌙', hot:false },
      ],
    };

    const POPULARES = [
      { t:'Oppenheimer',         g:'Drama · História · 2023',   c:32, badge:'hot'      },
      { t:'Alien: Romulus',      g:'Terror · Sci-Fi · 2024',    c:28, badge:'hot'      },
      { t:'Dune: Part Two',      g:'Ficção Científica · 2024',  c:21, badge:'trending' },
      { t:'Gladiador II',        g:'Ação · Drama · 2024',       c:18, badge:'trending' },
      { t:'Deadpool & Wolverine',g:'Ação · Comédia · 2024',     c:14, badge:'trending' },
      { t:'Poor Things',         g:'Drama · Fantasia · 2023',   c:-5, badge:'descida'  },
    ];

    // Ler mood da sessão
    const moodKey = sessionStorage.getItem('mood') || 'tenso';
    const mood    = MOODS[moodKey] || MOODS.tenso;

    document.getElementById('mood-icon').textContent  = mood.icon;
    document.getElementById('mood-label').textContent = mood.label;

    // Render recomendações
    const recs = RECS[moodKey] || RECS.tenso;
    const recScroll = document.getElementById('rec-scroll');
    recScroll.innerHTML = recs.map(f => `
      <div class="rec-card">
        <div class="rec-poster">
          ${f.icon}
          ${f.hot ? '<span class="rec-poster-badge badge badge-red">🔥 Hot</span>' : ''}
        </div>
        <div class="rec-body">
          <div class="rec-name">${f.t}</div>
          <div class="rec-genre">${f.g}</div>
          <div class="rec-bar-bg"><div class="rec-bar-fill" style="width:${f.p}%"></div></div>
        </div>
      </div>`).join('');

    // Render populares
    const popList = document.getElementById('pop-list');
    popList.innerHTML = POPULARES.map((f, i) => {
      const badge = f.badge === 'hot'
        ? '<span class="badge badge-red">🔥 Hot</span>'
        : f.badge === 'trending'
        ? '<span class="badge badge-purp">↑ Trending</span>'
        : '<span class="badge badge-gray">↓ A descer</span>';
      const growth = f.c > 0
        ? `<span class="pop-growth growth-up">+${f.c}%</span>`
        : `<span class="pop-growth growth-down">${f.c}%</span>`;
      return `
        <div class="pop-item">
          <span class="pop-num">${i + 1}</span>
          <div class="pop-info">
            <div class="pop-name">${f.t}</div>
            <div class="pop-meta">${f.g}</div>
          </div>
          <div class="pop-right">${badge}${growth}</div>
        </div>`;
    }).join('');
  </script>

</body>
</html>
