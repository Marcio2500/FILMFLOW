<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filmflow flow</title>
</head>
<body>

    <h1>Filmflow</h1>
    <p>Bem-vindo ao filmflow - descobre o que portugal está a ver.</p>

    <hr>

    <h2>Navegação</h2\>
    <ul>
        <li><a href="login.html">Registo / login</a></li>
        <li><a href="tendencias.html">Tendências Nacionais</a></li>
        <li><a href="mood.html">Escolher mood</a></li>
        <li><a href="regiao.html">Top por região</a></li>
        <li><a href="comparar.html">Comparar cidades</a></li>
        <li><a href="recomendaçoes.html">Recomendações</a></li>
    </ul>

    <hr>

    <h2>Filmes em Destaque</h2>
    <div id="listas-filmes">
        <p> A carregar filmes...</p>
    </div>

    <script>
        fetch('http://localhost:8001/get_filmes.php')
            .then(r => r.json())
            .then(filmes => {
                const div = document.getElementById('listas-filmes');
                if (filmes.length === 0) {
                    div.textContent = 'Nenhum filme encontrado.';
                    return;
                }
                let html = '<ul>';
                filmes.forEach(f => {
                    html += `<li><strong>${f.titulo}</strong> (${f.ano}) - popularidade: ${f.popularidade} - ${f.cidade || 'Nacional'}</li>`;
                });
                html += '</ul>';
                div.innerHTML = html;
            })
            .catch(() => {
                document.getElementById('listas-filmes').innerHTML = 'Erro ao carregar filmes.';
            });
    </script>
            
</body>
</html>
