<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmflow — Mapa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <span class="film">FILM</span><span class="flow">FLOW</span>
    </a>
    <ul class="navbar-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="mapa.html" class="active">Mapa</a></li>
      <li><a href="tendencias.html">Tendências</a></li>
      <li><a href="recomendacoes.html">Para Ti</a></li>
    </ul>
    <a href="login.html" class="btn-entrar">Entrar</a>
  </nav>

  <div class="section">
    <div class="section-header">
      <div>
        <h2 class="section-title">PORTUGAL EM ALTA</h2>
        <p class="section-desc">Clica numa cidade para ver o que está em alta</p>
      </div>
      <div style="display:flex;gap:0.75rem">
        <button class="btn-primary">Explorar</button>
        <a href="tendencias.html" class="btn-outline" style="display:flex;align-items:center;gap:0.4rem;text-decoration:none">⇄ Comparar</a>
      </div>
    </div>

    <div class="mapa-layout">
      <div class="mapa-side">
        <svg id="mapa-svg" viewBox="150 50 180 380" xmlns="http://www.w3.org/2000/svg">

          <!-- Silhueta Portugal Continental -->
          <path d="
            M 210,30 L 225,28 L 245,32 L 265,38 L 278,48 L 285,62 L 282,78
            L 290,88 L 298,102 L 295,118 L 302,130 L 308,148 L 305,162
            L 312,175 L 315,192 L 310,208 L 316,222 L 318,240 L 312,255
            L 318,268 L 320,285 L 315,300 L 318,315 L 312,330 L 305,345
            L 295,358 L 280,368 L 262,375 L 245,378 L 228,375 L 212,368
            L 198,355 L 188,340 L 180,325 L 175,308 L 172,290 L 175,272
            L 170,255 L 168,238 L 172,220 L 168,202 L 165,185 L 168,168
            L 165,150 L 162,132 L 165,115 L 162,98 L 158,82 L 162,66
            L 168,52 L 180,40 L 195,33 Z
          " fill="#1a1a22" stroke="rgba(229,24,27,0.3)" stroke-width="1.5"/>

          <!-- Linha do Algarve -->
          <path d="M 175,372 L 200,382 L 225,386 L 250,384 L 275,378 L 295,368" fill="none" stroke="rgba(229,24,27,0.2)" stroke-width="1"/>

        </svg>
      </div>

      <div class="mapa-painel">
        <div class="painel-empty" id="painel-empty">
          <div style="font-size:2rem;margin-bottom:0.75rem">🗺️</div>
          <p>Clica numa cidade<br>para ver o que está em alta</p>
        </div>
        <div id="painel-content" style="display:none">
          <h3 class="painel-city" id="painel-city"></h3>
          <p class="painel-count" id="painel-count"></p>
          <div id="painel-films"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOP POR REGIÃO -->
  <div class="section" style="background:#0a0a0a;padding-top:0">
    <div class="section-header" style="margin-bottom:1.5rem">
      <h3 class="section-title">TOP POR REGIÃO</h3>
      <span style="font-size:0.75rem;color:rgba(255,255,255,0.3);letter-spacing:1px;align-self:center">ESTA SEMANA</span>
    </div>
    <div class="top-regiao-scroll" id="top-regiao"></div>
  </div>

  <style>
    .mapa-layout {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
    }

    .mapa-side {
      flex: 1;
      background: #0f0f14;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      min-height: 560px;
      position: relative;
    }

    #mapa-svg {
      width: 70%;
      max-width: 380px;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(229,24,27,0.08));
    }

    /* CITY DOTS */
    .city-dot { cursor: pointer; }

    .city-dot .core {
      transition: r 0.15s ease, fill 0.15s ease;
    }

    .city-dot:hover .core { r: 8; }

    .city-dot .ring1 {
      opacity: 0;
      transition: opacity 0.2s;
    }

    .city-dot .ring2 {
      opacity: 0;
      transition: opacity 0.2s;
    }

    .city-dot.selected .core { fill: #e5181b !important; }

    @keyframes pulse1 { 0%{r:8;opacity:0.5} 100%{r:20;opacity:0} }
    @keyframes pulse2 { 0%{r:8;opacity:0.3} 100%{r:28;opacity:0} }

    .city-dot.selected .ring1 {
      opacity: 1;
      animation: pulse1 1.8s ease-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    .city-dot.selected .ring2 {
      opacity: 1;
      animation: pulse2 1.8s ease-out infinite 0.3s;
      transform-origin: center;
      transform-box: fill-box;
    }

    .city-name-label {
      font-size: 9px;
      fill: rgba(255,255,255,0.5);
      font-family: 'Outfit', sans-serif;
      pointer-events: none;
      transition: fill 0.2s;
    }

    .city-dot.selected .city-name-label { fill: #fff; }
    .city-dot:hover .city-name-label { fill: rgba(255,255,255,0.9); }

    /* PAINEL */
    .mapa-painel {
      width: 320px;
      flex-shrink: 0;
      background: #0f0f14;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.5rem;
      min-height: 560px;
      display: flex;
      flex-direction: column;
    }

    .painel-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.2);
      font-size: 0.88rem;
      text-align: center;
      line-height: 1.7;
    }

    .painel-city {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #fff;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .painel-count {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .painel-film-card {
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .painel-film-card.visible { opacity: 1; transform: translateX(0); }
    .painel-film-card:last-child { border-bottom: none; }

    .painel-film-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }

    .painel-film-name { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .painel-film-type { font-size: 0.72rem; color: rgba(255,255,255,0.3); }
    .painel-film-meta { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-bottom: 0.6rem; }

    .painel-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .painel-bar-row { display: flex; align-items: center; gap: 0.6rem; }
    .painel-bar-bg { flex: 1; height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
    .painel-bar-fill { height: 4px; background: #2563eb; border-radius: 2px; width: 0; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
    .painel-pct { font-size: 0.82rem; font-weight: 700; color: #4ade80; white-space: nowrap; }

    /* TOP REGIÃO */
    .top-regiao-scroll {
      display: flex;
      gap: 2rem;
      overflow-x: auto;
      padding-bottom: 1rem;
    }
    .top-regiao-scroll::-webkit-scrollbar { height: 3px; }
    .top-regiao-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .regiao-col { flex-shrink: 0; min-width: 155px; }
    .regiao-col-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 1.5px;
      color: #e5181b;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(229,24,27,0.2);
    }
    .regiao-item { margin-bottom: 0.9rem; }
    .regiao-item-num { font-size: 0.75rem; color: rgba(255,255,255,0.25); margin-bottom: 0.1rem; }
    .regiao-item-name { font-size: 0.88rem; font-weight: 700; color: #fff; }
    .regiao-item-meta { font-size: 0.7rem; color: rgba(255,255,255,0.35); }
  </style>

  <script>
    // Cidades com coordenadas ajustadas à silhueta
    const CIDADES = [
      { id:'viana',      nome:'Viana do Castelo', cx:192, cy:68  },
      { id:'braga',      nome:'Braga',            cx:200, cy:90  },
      { id:'braganca',   nome:'Bragança',         cx:278, cy:82  },
      { id:'porto',      nome:'Porto',            cx:186, cy:118 },
      { id:'vreal',      nome:'Vila Real',        cx:245, cy:105 },
      { id:'aveiro',     nome:'Aveiro',           cx:182, cy:148 },
      { id:'viseu',      nome:'Viseu',            cx:238, cy:140 },
      { id:'guarda',     nome:'Guarda',           cx:268, cy:168 },
      { id:'coimbra',    nome:'Coimbra',          cx:192, cy:178 },
      { id:'castelo',    nome:'Castelo Branco',   cx:258, cy:205 },
      { id:'leiria',     nome:'Leiria',           cx:185, cy:208 },
      { id:'portalegre', nome:'Portalegre',       cx:268, cy:240 },
      { id:'santarem',   nome:'Santarém',         cx:195, cy:242 },
      { id:'lisboa',     nome:'Lisboa',           cx:178, cy:278 },
      { id:'evora',      nome:'Évora',            cx:252, cy:278 },
      { id:'setubal',    nome:'Setúbal',          cx:182, cy:305 },
      { id:'beja',       nome:'Beja',             cx:248, cy:318 },
      { id:'faro',       nome:'Faro',             cx:228, cy:368 },
    ];

    const FILMES_MAPA = {
      viana:     [{t:'Poor Things',    tipo:'Filme', m:'2023 · Drama · Fantasia',   p:65,c:15},{t:'The Last of Us',  tipo:'Série', m:'2023 · Drama · Aventura', p:58,c:12},{t:'Breaking Bad',   tipo:'Série', m:'2008 · Drama · Crime',     p:52,c:8}],
      braga:     [{t:'Gladiador II',   tipo:'Filme', m:'2024 · Ação · Drama',       p:90,c:22},{t:'Alien: Romulus', tipo:'Filme', m:'2024 · Terror · Sci-Fi',  p:80,c:18},{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica', p:68,c:9}],
      porto:     [{t:'Gladiador II',   tipo:'Filme', m:'2024 · Ação · Drama',       p:95,c:22},{t:'Alien: Romulus', tipo:'Filme', m:'2024 · Terror · Sci-Fi',  p:88,c:25},{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica', p:80,c:14}],
      aveiro:    [{t:'Poor Things',    tipo:'Filme', m:'2023 · Drama · Fantasia',   p:78,c:11},{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica',p:70,c:6},{t:'Oppenheimer',    tipo:'Filme', m:'2023 · Drama · História',  p:63,c:5}],
      coimbra:   [{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica',  p:85,c:19},{t:'Oppenheimer',   tipo:'Filme', m:'2023 · Drama · História', p:78,c:13},{t:'Gladiador II',   tipo:'Filme', m:'2024 · Ação · Drama',      p:65,c:8}],
      lisboa:    [{t:'Oppenheimer',    tipo:'Filme', m:'2023 · Drama · História',   p:98,c:32},{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica',p:94,c:28},{t:'Alien: Romulus', tipo:'Filme', m:'2024 · Terror · Sci-Fi',  p:89,c:21}],
      faro:      [{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica',  p:88,c:20},{t:'Oppenheimer',   tipo:'Filme', m:'2023 · Drama · História', p:82,c:15},{t:'Gladiador II',   tipo:'Filme', m:'2024 · Ação · Drama',      p:70,c:9}],
      evora:     [{t:'Alien: Romulus', tipo:'Filme', m:'2024 · Terror · Sci-Fi',    p:74,c:12},{t:'Poor Things',   tipo:'Filme', m:'2023 · Drama · Fantasia', p:66,c:8},{t:'Oppenheimer',    tipo:'Filme', m:'2023 · Drama · História',  p:58,c:5}],
      setubal:   [{t:'Gladiador II',   tipo:'Filme', m:'2024 · Ação · Drama',       p:80,c:17},{t:'Alien: Romulus',tipo:'Filme', m:'2024 · Terror · Sci-Fi',  p:65,c:6},{t:'Dune: Part Two',  tipo:'Filme', m:'2024 · Ficção Científica', p:60,c:4}],
      leiria:    [{t:'Gladiador II',   tipo:'Filme', m:'2024 · Ação · Drama',       p:76,c:16},{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica',p:68,c:10},{t:'Poor Things',   tipo:'Filme', m:'2023 · Drama · Fantasia', p:59,c:5}],
      santarem:  [{t:'Alien: Romulus', tipo:'Filme', m:'2024 · Terror · Sci-Fi',    p:75,c:13},{t:'Gladiador II',  tipo:'Filme', m:'2024 · Ação · Drama',      p:68,c:9},{t:'Oppenheimer',    tipo:'Filme', m:'2023 · Drama · História',  p:60,c:6}],
      viseu:     [{t:'Oppenheimer',    tipo:'Filme', m:'2023 · Drama · História',   p:72,c:10},{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica',p:65,c:7},{t:'Poor Things',    tipo:'Filme', m:'2023 · Drama · Fantasia', p:58,c:4}],
      guarda:    [{t:'Gladiador II',   tipo:'Filme', m:'2024 · Ação · Drama',       p:63,c:8},{t:'Poor Things',    tipo:'Filme', m:'2023 · Drama · Fantasia', p:55,c:4},{t:'Alien: Romulus',  tipo:'Filme', m:'2024 · Terror · Sci-Fi',  p:50,c:3}],
      castelo:   [{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica',  p:67,c:9},{t:'Alien: Romulus', tipo:'Filme', m:'2024 · Terror · Sci-Fi',  p:60,c:6},{t:'Oppenheimer',    tipo:'Filme', m:'2023 · Drama · História',  p:55,c:4}],
      portalegre:[{t:'Poor Things',    tipo:'Filme', m:'2023 · Drama · Fantasia',   p:65,c:7},{t:'Oppenheimer',   tipo:'Filme', m:'2023 · Drama · História',  p:58,c:5},{t:'Gladiador II',    tipo:'Filme', m:'2024 · Ação · Drama',      p:52,c:3}],
      beja:      [{t:'Dune: Part Two', tipo:'Filme', m:'2024 · Ficção Científica',  p:70,c:14},{t:'Gladiador II',  tipo:'Filme', m:'2024 · Ação · Drama',      p:62,c:7},{t:'Poor Things',    tipo:'Filme', m:'2023 · Drama · Fantasia', p:55,c:3}],
      vreal:     [{t:'Poor Things',    tipo:'Filme', m:'2023 · Drama · Fantasia',   p:68,c:8},{t:'Oppenheimer',   tipo:'Filme', m:'2023 · Drama · História',  p:62,c:6},{t:'Dune: Part Two',  tipo:'Filme', m:'2024 · Ficção Científica', p:55,c:4}],
      braganca:  [{t:'Alien: Romulus', tipo:'Filme', m:'2024 · Terror · Sci-Fi',    p:60,c:9},{t:'Gladiador II',  tipo:'Filme', m:'2024 · Ação · Drama',       p:55,c:5},{t:'Poor Things',    tipo:'Filme', m:'2023 · Drama · Fantasia', p:48,c:3}],
    };

    const TOP_REGIOES = [
      { nome:'Lisboa',  filmes:[{t:'Oppenheimer',g:'Drama 2023'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Alien: Romulus',g:'Terror 2024'}]},
      { nome:'Porto',   filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Alien: Romulus',g:'Terror 2024'},{t:'Oppenheimer',g:'Drama 2023'}]},
      { nome:'Coimbra', filmes:[{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Oppenheimer',g:'Drama 2023'},{t:'Gladiador II',g:'Ação 2024'}]},
      { nome:'Faro',    filmes:[{t:'Oppenheimer',g:'Drama 2023'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Poor Things',g:'Drama 2023'}]},
      { nome:'Braga',   filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Alien: Romulus',g:'Terror 2024'},{t:'Dune: Part Two',g:'Sci-fi 2024'}]},
      { nome:'Aveiro',  filmes:[{t:'Poor Things',g:'Drama 2023'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Oppenheimer',g:'Drama 2023'}]},
      { nome:'Setúbal', filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Alien: Romulus',g:'Terror 2024'},{t:'Dune: Part Two',g:'Sci-fi 2024'}]},
      { nome:'Évora',   filmes:[{t:'Alien: Romulus',g:'Terror 2024'},{t:'Poor Things',g:'Drama 2023'},{t:'Oppenheimer',g:'Drama 2023'}]},
      { nome:'Leiria',  filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Poor Things',g:'Drama 2023'}]},
      { nome:'Viseu',   filmes:[{t:'Oppenheimer',g:'Drama 2023'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Poor Things',g:'Drama 2023'}]},
      { nome:'Guarda',  filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Poor Things',g:'Drama 2023'},{t:'Alien: Romulus',g:'Terror 2024'}]},
      { nome:'Beja',    filmes:[{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Gladiador II',g:'Ação 2024'},{t:'Poor Things',g:'Drama 2023'}]},
    ];

    // Render cidades no SVG
    const svg = document.getElementById('mapa-svg');
    CIDADES.forEach(c => {
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','city-dot');
      g.dataset.id = c.id;
      g.innerHTML = `
        <circle cx="${c.cx}" cy="${c.cy}" r="26" fill="rgba(229,24,27,0)" class="ring2" stroke="rgba(229,24,27,0.2)" stroke-width="1"/>
        <circle cx="${c.cx}" cy="${c.cy}" r="20" fill="rgba(229,24,27,0)" class="ring1" stroke="rgba(229,24,27,0.35)" stroke-width="1"/>
        <circle cx="${c.cx}" cy="${c.cy}" r="5" fill="rgba(255,255,255,0.25)" class="core"/>
        <text x="${c.cx + 8}" y="${c.cy + 4}" class="city-name-label">${c.nome}</text>
      `;
      g.addEventListener('click', () => selectCidade(c.id, c.nome));
      svg.appendChild(g);
    });

    function selectCidade(id, nome) {
      // Reset todos
      document.querySelectorAll('.city-dot').forEach(d => {
        d.classList.remove('selected');
        d.querySelector('.core').setAttribute('fill','rgba(255,255,255,0.25)');
        d.querySelector('.core').setAttribute('r','5');
      });

      // Selecionar
      const dot = document.querySelector(`[data-id="${id}"]`);
      dot.classList.add('selected');
      dot.querySelector('.core').setAttribute('fill','#e5181b');
      dot.querySelector('.core').setAttribute('r','7');

      const filmes = FILMES_MAPA[id] || [];
      const max = filmes[0]?.p || 100;

      document.getElementById('painel-empty').style.display = 'none';
      document.getElementById('painel-content').style.display = 'block';
      document.getElementById('painel-city').textContent = nome;
      document.getElementById('painel-count').textContent = filmes.length + ' títulos em alta';

      document.getElementById('painel-films').innerHTML = filmes.map((f, i) => `
        <div class="painel-film-card" id="pfc-${i}">
          <div class="painel-film-top">
            <div>
              <div class="painel-film-name">${f.t}</div>
              <div class="painel-film-type">${f.tipo}</div>
            </div>
            <span class="painel-badge">↑ Trending</span>
          </div>
          <div class="painel-film-meta">${f.m}</div>
          <div class="painel-bar-row">
            <div class="painel-bar-bg">
              <div class="painel-bar-fill" id="pfb-${i}"></div>
            </div>
            <span class="painel-pct">${Math.round(f.p/max*100)}%</span>
          </div>
        </div>`).join('');

      // Animar entrada
      filmes.forEach((f, i) => {
        setTimeout(() => {
          const card = document.getElementById(`pfc-${i}`);
          if (card) card.classList.add('visible');
          setTimeout(() => {
            const bar = document.getElementById(`pfb-${i}`);
            if (bar) bar.style.width = Math.round(f.p/max*100) + '%';
          }, 80);
        }, i * 100);
      });
    }

    // Render top regiões
    document.getElementById('top-regiao').innerHTML = TOP_REGIOES.map(r => `
      <div class="regiao-col">
        <div class="regiao-col-title">${r.nome.toUpperCase()}</div>
        ${r.filmes.map((f,i) => `
          <div class="regiao-item">
            <div class="regiao-item-num">${i+1}</div>
            <div class="regiao-item-name">${f.t}</div>
            <div class="regiao-item-meta">${f.g}</div>
          </div>`).join('')}
      </div>`).join('');
  </script>

</body>
</html>
