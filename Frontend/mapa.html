  <div class="section">
    <div class="section-header">
      <div>
        <h2 class="section-title">PORTUGAL EM ALTA</h2>
        <p class="section-desc">Clica numa cidade para explorar ou em duas para comparar</p>
      </div>
      <div style="display:flex;gap:0.75rem;align-items:center">
        <button class="mode-btn active" id="btn-explorar" onclick="setModo('explorar')">Explorar</button>
        <button class="mode-btn" id="btn-comparar" onclick="setModo('comparar')">⇄ Comparar</button>
      </div>
    </div>

    <div class="mapa-layout">

        </div>
        <div id="painel-content" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- TOP POR REGIÃO -->
  <div class="section" style="background:#0a0a0a;padding-top:0">
    <div class="section-header" style="margin-bottom:1.5rem">
      <h3 class="section-title">TOP POR REGIÃO</h3>
      <span style="font-size:0.75rem;color:rgba(255,255,255,0.3);letter-spacing:1px">ESTA SEMANA</span>
    </div>
    <div class="top-regiao-scroll" id="top-regiao"></div>
  </div>

  <style>
    .mode-btn {
      padding: 0.45rem 1.1rem;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .mode-btn.active { background: #e5181b; color: #fff; border-color: #e5181b; }

    .mapa-layout { display:flex; gap:1.5rem; align-items:flex-start; }

    .mapa-side {
      flex: 1;
      background: #0f0f14;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      min-height: 480px;
    }

    #mapa-svg { width: 100%; max-width: 380px; height: auto; filter: drop-shadow(0 0 20px rgba(229,24,27,0.06)); }

    .city-dot { cursor: pointer; }
    .city-dot circle.core { transition: all 0.2s; }
    .city-dot:hover circle.core { r: 7; }
    .city-name-label { font-size: 9px; fill: rgba(255,255,255,0.5); font-family:'Outfit',sans-serif; pointer-events:none; }

    @keyframes pulse-a { 0%{r:10;opacity:0.5} 100%{r:22;opacity:0} }
    @keyframes pulse-b { 0%{r:10;opacity:0.5} 100%{r:22;opacity:0} }

    .city-dot.sel-a circle.pulse { animation: pulse-a 1.8s ease-out infinite; transform-origin:center; transform-box:fill-box; }
    .city-dot.sel-b circle.pulse { animation: pulse-b 1.8s ease-out infinite; transform-origin:center; transform-box:fill-box; }

    .mapa-painel {
      width: 340px;
      flex-shrink: 0;
      background: #0f0f14;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.5rem;
      min-height: 580px;
      display: flex;
      flex-direction: column;
    }

    .painel-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.25);
      font-size: 0.88rem;
      text-align: center;
      line-height: 1.7;
    }

    /* EXPLORAR */
    .painel-city-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .painel-city-count {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .painel-film {
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .painel-film.visible { opacity: 1; transform: translateX(0); }
    .painel-film:last-child { border-bottom: none; }

    .pf-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.2);
      flex-shrink: 0;
      width: 20px;
    }

    .pf-info { flex: 1; min-width: 0; }
    .pf-name { font-size: 0.9rem; font-weight: 700; color: #fff; }
    .pf-meta { font-size: 0.72rem; color: rgba(255,255,255,0.35); margin-top: 1px; }

    .pf-pct { font-size: 0.9rem; font-weight: 700; color: #4ade80; flex-shrink: 0; }

    /* COMPARAR */
    .comparar-bloco {
      flex: 1;
      border-radius: 8px;
      padding: 1rem;
    }

    .comparar-bloco.bloco-a {
      background: rgba(229,24,27,0.08);
      border: 1px solid rgba(229,24,27,0.2);
    }

    .comparar-bloco.bloco-b {
      background: rgba(37,99,235,0.08);
      border: 1px solid rgba(37,99,235,0.2);
    }

    .bloco-city {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin-bottom: 0.75rem;
    }

    .bloco-a .bloco-city { color: #e5181b; }
    .bloco-b .bloco-city { color: #2563eb; }

    .bloco-film {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .bloco-film:last-child { border-bottom: none; }
    .bloco-film-name { font-size: 0.82rem; font-weight: 600; color: #fff; }
    .bloco-film-meta { font-size: 0.7rem; color: rgba(255,255,255,0.35); }
    .bloco-film-pct { font-size: 0.82rem; font-weight: 700; color: #4ade80; flex-shrink: 0; }

    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 0;
      flex-shrink: 0;
    }

    .vs-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }

    .comparar-hint {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.25);
      font-size: 0.88rem;
      text-align: center;
      line-height: 1.7;
      gap: 0.75rem;
    }

    /* TOP REGIÃO */
    .top-regiao-scroll { display:flex; gap:2rem; overflow-x:auto; padding-bottom:1rem; }
    .top-regiao-scroll::-webkit-scrollbar { height:3px; }
    .top-regiao-scroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
    .regiao-col { flex-shrink:0; min-width:155px; }
    .regiao-col-title { font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:1.5px; color:#e5181b; margin-bottom:1rem; padding-bottom:0.5rem; border-bottom:1px solid rgba(229,24,27,0.2); }
    .regiao-item { margin-bottom:0.9rem; }
    .regiao-item-num { font-size:0.75rem; color:rgba(255,255,255,0.25); margin-bottom:0.1rem; }
    .regiao-item-name { font-size:0.88rem; font-weight:700; color:#fff; }
    .regiao-item-meta { font-size:0.7rem; color:rgba(255,255,255,0.35); }
  </style>

  <script>
    const CIDADES = [
      { id:'viana',      nome:'Viana do Castelo', cx:192, cy:68  },
      { id:'braga',      nome:'Braga',            cx:200, cy:90  },
      { id:'braganca',   nome:'Bragança',         cx:278, cy:82  },

      { id:'vreal',      nome:'Vila Real',        cx:245, cy:105 },

      { id:'viseu',      nome:'Viseu',            cx:238, cy:140 },
      { id:'guarda',     nome:'Guarda',           cx:268, cy:168 },
      { id:'coimbra',    nome:'Coimbra',          cx:192, cy:178 },
      { id:'castelo',    nome:'Castelo Branco',   cx:258, cy:205 },
      { id:'leiria',     nome:'Leiria',           cx:185, cy:208 },
      { id:'portalegre', nome:'Portalegre',       cx:268, cy:240 },
      { id:'santarem',   nome:'Santarém',         cx:195, cy:242 },
      { id:'lisboa',     nome:'Lisboa',           cx:178, cy:278 },
      { id:'evora',      nome:'Évora',            cx:252, cy:278 },
      { id:'setubal',    nome:'Setúbal',          cx:182, cy:305 },
      { id:'beja',       nome:'Beja',             cx:248, cy:318 },
      { id:'faro',       nome:'Faro',             cx:228, cy:368 },
    ];

    const FILMES_MAPA = {
      viana:     [{t:'Poor Things',    m:'Filme · 2023', p:65},{t:'The Last of Us',  m:'Série · 2023', p:58},{t:'Breaking Bad',   m:'Série · 2008', p:52}],
      braga:     [{t:'Gladiador II',   m:'Filme · 2024', p:85},{t:'Alien: Romulus',  m:'Filme · 2024', p:78},{t:'The Bear',       m:'Série · 2024', p:71},{t:'Stranger Things',m:'Série · 2024', p:67},{t:'Shogun',         m:'Série · 2024', p:60}],
      porto:     [{t:'Gladiador II',   m:'Filme · 2024', p:95},{t:'Alien: Romulus',  m:'Filme · 2024', p:88},{t:'Dune: Part Two', m:'Filme · 2024', p:80}],
      aveiro:    [{t:'Poor Things',    m:'Filme · 2023', p:78},{t:'Dune: Part Two',  m:'Filme · 2024', p:70},{t:'Oppenheimer',   m:'Filme · 2023', p:63}],
      coimbra:   [{t:'Dune: Part Two', m:'Filme · 2024', p:85},{t:'Oppenheimer',    m:'Filme · 2023', p:78},{t:'Gladiador II',  m:'Filme · 2024', p:65}],
      lisboa:    [{t:'Oppenheimer',    m:'Filme · 2023', p:98},{t:'Dune: Part Two',  m:'Filme · 2024', p:94},{t:'Alien: Romulus',m:'Filme · 2024', p:89}],
      faro:      [{t:'Dune: Part Two', m:'Filme · 2024', p:88},{t:'Oppenheimer',    m:'Filme · 2023', p:82},{t:'Gladiador II',  m:'Filme · 2024', p:70}],
      evora:     [{t:'Alien: Romulus', m:'Filme · 2024', p:74},{t:'Poor Things',    m:'Filme · 2023', p:66},{t:'Oppenheimer',   m:'Filme · 2023', p:58}],
      setubal:   [{t:'Gladiador II',   m:'Filme · 2024', p:80},{t:'Alien: Romulus', m:'Filme · 2024', p:65},{t:'Dune: Part Two', m:'Filme · 2024', p:60}],
      leiria:    [{t:'Gladiador II',   m:'Filme · 2024', p:76},{t:'Dune: Part Two', m:'Filme · 2024', p:68},{t:'Poor Things',   m:'Filme · 2023', p:59}],
      santarem:  [{t:'Alien: Romulus', m:'Filme · 2024', p:75},{t:'Gladiador II',   m:'Filme · 2024', p:68},{t:'Oppenheimer',   m:'Filme · 2023', p:60}],
      viseu:     [{t:'Oppenheimer',    m:'Filme · 2023', p:72},{t:'Dune: Part Two', m:'Filme · 2024', p:65},{t:'Poor Things',   m:'Filme · 2023', p:58}],
      guarda:    [{t:'Gladiador II',   m:'Filme · 2024', p:63},{t:'Poor Things',    m:'Filme · 2023', p:55},{t:'Alien: Romulus', m:'Filme · 2024', p:50}],
      castelo:   [{t:'Dune: Part Two', m:'Filme · 2024', p:67},{t:'Alien: Romulus', m:'Filme · 2024', p:60},{t:'Oppenheimer',   m:'Filme · 2023', p:55}],
      portalegre:[{t:'Poor Things',    m:'Filme · 2023', p:65},{t:'Oppenheimer',    m:'Filme · 2023', p:58},{t:'Gladiador II',  m:'Filme · 2024', p:52}],
      beja:      [{t:'Dune: Part Two', m:'Filme · 2024', p:70},{t:'Gladiador II',   m:'Filme · 2024', p:62},{t:'Poor Things',   m:'Filme · 2023', p:55}],
      vreal:     [{t:'Poor Things',    m:'Filme · 2023', p:68},{t:'Oppenheimer',    m:'Filme · 2023', p:62},{t:'Dune: Part Two', m:'Filme · 2024', p:55}],
      braganca:  [{t:'Alien: Romulus', m:'Filme · 2024', p:60},{t:'Gladiador II',   m:'Filme · 2024', p:55},{t:'Poor Things',   m:'Filme · 2023', p:48}],
    };

    const TOP_REGIOES = [
      { nome:'Lisboa',  filmes:[{t:'Oppenheimer',g:'Drama 2023'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Alien: Romulus',g:'Terror 2024'}]},
      { nome:'Porto',   filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Alien: Romulus',g:'Terror 2024'},{t:'Oppenheimer',g:'Drama 2023'}]},
      { nome:'Coimbra', filmes:[{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Oppenheimer',g:'Drama 2023'},{t:'Gladiador II',g:'Ação 2024'}]},
      { nome:'Faro',    filmes:[{t:'Oppenheimer',g:'Drama 2023'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Poor Things',g:'Drama 2023'}]},
      { nome:'Braga',   filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Alien: Romulus',g:'Terror 2024'},{t:'Dune: Part Two',g:'Sci-fi 2024'}]},
      { nome:'Aveiro',  filmes:[{t:'Poor Things',g:'Drama 2023'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Oppenheimer',g:'Drama 2023'}]},
      { nome:'Setúbal', filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Alien: Romulus',g:'Terror 2024'},{t:'Dune: Part Two',g:'Sci-fi 2024'}]},
      { nome:'Évora',   filmes:[{t:'Alien: Romulus',g:'Terror 2024'},{t:'Poor Things',g:'Drama 2023'},{t:'Oppenheimer',g:'Drama 2023'}]},
      { nome:'Leiria',  filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Poor Things',g:'Drama 2023'}]},
      { nome:'Viseu',   filmes:[{t:'Oppenheimer',g:'Drama 2023'},{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Poor Things',g:'Drama 2023'}]},
      { nome:'Guarda',  filmes:[{t:'Gladiador II',g:'Ação 2024'},{t:'Poor Things',g:'Drama 2023'},{t:'Alien: Romulus',g:'Terror 2024'}]},
      { nome:'Beja',    filmes:[{t:'Dune: Part Two',g:'Sci-fi 2024'},{t:'Gladiador II',g:'Ação 2024'},{t:'Poor Things',g:'Drama 2023'}]},
    ];

    let modo = 'explorar';
    let cidadeA = null;
    let cidadeB = null;

    function setModo(m) {
      modo = m;
      document.getElementById('btn-explorar').classList.toggle('active', m === 'explorar');
      document.getElementById('btn-comparar').classList.toggle('active', m === 'comparar');

      // Reset seleções
      cidadeA = null;
      cidadeB = null;
      document.querySelectorAll('.city-dot').forEach(d => {
        d.classList.remove('sel-a','sel-b');
        d.querySelector('.core').setAttribute('fill','rgba(255,255,255,0.25)');
        d.querySelector('.core').setAttribute('r','5');
        d.querySelector('.pulse').setAttribute('stroke','rgba(229,24,27,0)');
      });

      const empty = document.getElementById('painel-empty');
      const content = document.getElementById('painel-content');
      empty.style.display = 'flex';
      content.style.display = 'none';

      document.getElementById('painel-empty-text').innerHTML = m === 'explorar'
        ? 'Clica numa cidade<br>para ver o que está em alta'
        : 'Clica em duas cidades<br>para as comparar';
    }

    function clickCidade(id, nome) {
      if (modo === 'explorar') {
        explorarCidade(id, nome);
      } else {
        compararCidade(id, nome);
      }
    }

    function explorarCidade(id, nome) {
      // Reset todos
      document.querySelectorAll('.city-dot').forEach(d => {
        d.classList.remove('sel-a','sel-b');
        d.querySelector('.core').setAttribute('fill','rgba(255,255,255,0.25)');
        d.querySelector('.core').setAttribute('r','5');
        d.querySelector('.pulse').setAttribute('stroke','rgba(229,24,27,0)');
      });

      // Selecionar
      const dot = document.querySelector(`[data-id="${id}"]`);
      dot.classList.add('sel-a');
      dot.querySelector('.core').setAttribute('fill','#e5181b');
      dot.querySelector('.core').setAttribute('r','7');
      dot.querySelector('.pulse').setAttribute('stroke','rgba(229,24,27,0.4)');

      const filmes = FILMES_MAPA[id] || [];
      document.getElementById('painel-empty').style.display = 'none';
      document.getElementById('painel-content').style.display = 'block';
      document.getElementById('painel-content').innerHTML = `
        <div class="painel-city-name" style="color:#fff">${nome}</div>
        <div class="painel-city-count">${filmes.length} títulos em alta</div>
        ${filmes.map((f, i) => `
          <div class="painel-film" id="pf-${i}">
            <span class="pf-num">${i+1}</span>
            <div class="pf-info">
              <div class="pf-name">${f.t}</div>
              <div class="pf-meta">${f.m}</div>
            </div>
            <span class="pf-pct">${f.p}%</span>
          </div>`).join('')}
      `;

     filmes.forEach((_, i) => {
  setTimeout(() => {
    const el = document.getElementById(`pf-${i}`);
    if (el) el.classList.add('visible');
  }, i * 80);
});

setTimeout(async () => {
  for (const f of filmes) {
    const poster = await getTMDBPoster(f.t);
    if (poster) {
      const els = document.querySelectorAll('.pf-name');
      els.forEach(el => {
        if (el.textContent === f.t) {
          const card = el.closest('.painel-film');
          if (card) {
            card.style.backgroundImage = `url(${poster})`;
            card.style.backgroundSize = 'cover';
            card.style.backgroundPosition = 'center';
            card.style.borderRadius = '8px';
            card.style.padding = '0.5rem';
            card.style.minHeight = '80px';
          }
        }
      });
    }
  }
}, 500);
    }

    function compararCidade(id, nome) {
      const dot = document.querySelector(`[data-id="${id}"]`);

      if (!cidadeA) {
        cidadeA = { id, nome };
        dot.classList.add('sel-a');
        dot.querySelector('.core').setAttribute('fill','#e5181b');
        dot.querySelector('.core').setAttribute('r','7');
        dot.querySelector('.pulse').setAttribute('stroke','rgba(229,24,27,0.4)');

        document.getElementById('painel-empty').style.display = 'none';
        document.getElementById('painel-content').style.display = 'block';
        document.getElementById('painel-content').innerHTML = `
          <div class="comparar-hint">
            <div style="font-size:1.5rem">📍</div>
            <p><strong style="color:#e5181b">${nome}</strong> selecionada<br>Clica numa segunda cidade</p>
          </div>`;

      } else if (!cidadeB && id !== cidadeA.id) {
        cidadeB = { id, nome };
        dot.classList.add('sel-b');
        dot.querySelector('.core').setAttribute('fill','#2563eb');
        dot.querySelector('.core').setAttribute('r','7');
        dot.querySelector('.pulse').setAttribute('stroke','rgba(37,99,235,0.4)');
        renderComparar();

      } else if (id === cidadeA?.id || id === cidadeB?.id) {
        // Desselecionar
        if (id === cidadeA?.id) {
          dot.classList.remove('sel-a');
          dot.querySelector('.core').setAttribute('fill','rgba(255,255,255,0.25)');
          dot.querySelector('.core').setAttribute('r','5');
          dot.querySelector('.pulse').setAttribute('stroke','rgba(229,24,27,0)');
          cidadeA = cidadeB;
          cidadeB = null;
          if (cidadeA) {
            const dotA = document.querySelector(`[data-id="${cidadeA.id}"]`);
            dotA.classList.remove('sel-b');
            dotA.classList.add('sel-a');
            dotA.querySelector('.core').setAttribute('fill','#e5181b');
            dotA.querySelector('.pulse').setAttribute('stroke','rgba(229,24,27,0.4)');
          }
        } else {
          dot.classList.remove('sel-b');
          dot.querySelector('.core').setAttribute('fill','rgba(255,255,255,0.25)');
          dot.querySelector('.core').setAttribute('r','5');
          dot.querySelector('.pulse').setAttribute('stroke','rgba(229,24,27,0)');
          cidadeB = null;
        }

        if (!cidadeA) {
          document.getElementById('painel-empty').style.display = 'flex';
          document.getElementById('painel-content').style.display = 'none';
        } else if (!cidadeB) {
          document.getElementById('painel-content').innerHTML = `
            <div class="comparar-hint">
              <div style="font-size:1.5rem">📍</div>
              <p><strong style="color:#e5181b">${cidadeA.nome}</strong> selecionada<br>Clica numa segunda cidade</p>
            </div>`;
        }
      }
    }

    function renderComparar() {
      const fA = FILMES_MAPA[cidadeA.id] || [];
      const fB = FILMES_MAPA[cidadeB.id] || [];

      document.getElementById('painel-content').innerHTML = `
        <div class="comparar-bloco bloco-a">
          <div class="bloco-city">${cidadeA.nome}</div>
          ${fA.map(f => `
            <div class="bloco-film">
              <div>
                <div class="bloco-film-name">${f.t}</div>
                <div class="bloco-film-meta">${f.m}</div>
              </div>
              <span class="bloco-film-pct">${f.p}%</span>
            </div>`).join('')}
        </div>
        <div class="vs-divider"><div class="vs-circle">VS</div></div>
        <div class="comparar-bloco bloco-b">
          <div class="bloco-city">${cidadeB.nome}</div>
          ${fB.map(f => `
            <div class="bloco-film">
              <div>
                <div class="bloco-film-name">${f.t}</div>
                <div class="bloco-film-meta">${f.m}</div>
              </div>
              <span class="bloco-film-pct">${f.p}%</span>
            </div>`).join('')}
        </div>`;
    }

    // Render SVG
    const svg = document.getElementById('mapa-svg');
    CIDADES.forEach(c => {
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','city-dot');
      g.dataset.id = c.id;
      g.innerHTML = `
        <circle cx="${c.cx}" cy="${c.cy}" r="18" fill="rgba(229,24,27,0)" class="pulse" stroke="rgba(229,24,27,0)" stroke-width="1"/>
        <circle cx="${c.cx}" cy="${c.cy}" r="5" fill="rgba(255,255,255,0.25)" class="core"/>
        <text x="${c.cx+8}" y="${c.cy+4}" class="city-name-label">${c.nome}</text>
      `;
      g.addEventListener('click', () => clickCidade(c.id, c.nome));
      svg.appendChild(g);
    });

    // Render top regiões
    document.getElementById('top-regiao').innerHTML = TOP_REGIOES.map(r => `
      <div class="regiao-col">
        <div class="regiao-col-title">${r.nome.toUpperCase()}</div>
        ${r.filmes.map((f,i) => `
          <div class="regiao-item">
            <div class="regiao-item-num">${i+1}</div>
            <div class="regiao-item-name">${f.t}</div>
            <div class="regiao-item-meta">${f.g}</div>
          </div>`).join('')}
      </div>`).join('');
  </script>
  <script src="tmdb.js"></script>
  <script src="chatbot-widget.js"></script>
  


</body>
